<div class="patient-layout">
  <aside class="sidebar">
    <div class="brand">MediChat</div>
    <p class="role-tag">Espace patient</p>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <p class="nav-title">Navigation</p>
        <a class="nav-link" routerLink="/patient-dashboard/accueil" routerLinkActive="active">Accueil</a>
        <a class="nav-link" routerLink="/patient-dashboard/medecins" routerLinkActive="active">Médecins</a>
        <a
          class="nav-link"
          routerLink="/patient-dashboard/rendez-vous"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          >Mes rendez-vous</a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <a class="nav-link ghost" routerLink="/">Site public</a>
      <button type="button" class="btn-logout" (click)="logout()">Déconnexion</button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet />
  </main>
</div>

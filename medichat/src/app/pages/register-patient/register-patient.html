<div class="register-page">
  <div class="register-card">

    <div class="header-box">
      <h1>Créer un compte</h1>
      <p>Inscrivez-vous en tant que patient</p>
    </div>

    <form class="register-form" (ngSubmit)="onRegister()">
      <div class="row two-cols">
        <div class="form-group">
          <label for="nom">Nom</label>
          <input
            type="text"
            id="nom"
            name="nom"
            placeholder="Entrez votre nom"
            [(ngModel)]="nom"
            required
          />
        </div>

        <div class="form-group">
          <label for="prenom">Prénom</label>
          <input
            type="text"
            id="prenom"
            name="prenom"
            placeholder="Entrez votre prénom"
            [(ngModel)]="prenom"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Entrez votre adresse e-mail"
          [(ngModel)]="email"
          required
        />
      </div>

      <div class="row two-cols">
        <div class="form-group">
          <label for="motDePasse">Mot de passe</label>
          <input
            type="password"
            id="motDePasse"
            name="motDePasse"
            placeholder="Entrez votre mot de passe"
            [(ngModel)]="motDePasse"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmer le mot de passe</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirmez votre mot de passe"
            [(ngModel)]="confirmPassword"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="telephone">Téléphone</label>
        <input
          type="text"
          id="telephone"
          name="telephone"
          placeholder="Entrez votre numéro de téléphone"
          [(ngModel)]="telephone"
        />
      </div>

      <div class="form-group">
        <label for="adresse">Adresse</label>
        <input
          type="text"
          id="adresse"
          name="adresse"
          placeholder="Entrez votre adresse"
          [(ngModel)]="adresse"
        />
      </div>

      <button type="submit" class="submit-btn">Créer mon compte</button>
      <p *ngIf="message" class="success-msg">
      {{ message }}
      </p>

      <p *ngIf="errorMessage" class="error-msg">
      {{ errorMessage }}
      </p>

      <p class="bottom-text" *ngIf="message" style="color: green;">
        {{ message }}
      </p>

      <p class="bottom-text" *ngIf="errorMessage" style="color: red;">
        {{ errorMessage }}
      </p>

      <p class="bottom-text">
        Déjà un compte ?
        <a [routerLink]="['/login']" [queryParams]="{ form: '1' }">Se connecter</a>
      </p>

      <p class="bottom-text">
        ← <a [routerLink]="['/login']" [queryParams]="{ form: '1' }">Retour à la connexion</a>
      </p>
    </form>
  </div>
</div>

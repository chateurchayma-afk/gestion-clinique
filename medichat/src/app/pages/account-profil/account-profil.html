<div class="account-profil">
  <header class="head">
    <h1>Mon profil</h1>
    <p class="muted">Modifiez les coordonnées de votre compte et, si besoin, votre mot de passe.</p>
  </header>

  @if (loading) {
    <p class="muted">Chargement…</p>
  } @else if (loadError) {
    <p class="warn">{{ loadError }}</p>
  } @else {
    <form class="card" [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid-2">
        <label class="field">
          <span>Nom</span>
          <input type="text" formControlName="nom" autocomplete="family-name" />
        </label>
        <label class="field">
          <span>Prénom</span>
          <input type="text" formControlName="prenom" autocomplete="given-name" />
        </label>
      </div>
      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
      </label>
      <label class="field">
        <span>Téléphone</span>
        <input type="text" formControlName="telephone" autocomplete="tel" />
      </label>
      <div class="grid-2">
        <label class="field">
          <span>Adresse</span>
          <input type="text" formControlName="adresse" autocomplete="street-address" />
        </label>
        <label class="field">
          <span>Ville</span>
          <input type="text" formControlName="ville" />
        </label>
      </div>
      <div class="grid-2">
        <label class="field">
          <span>Gouvernorat</span>
          <input type="text" formControlName="gouvernorat" />
        </label>
        <label class="field">
          <span>Code postal</span>
          <input type="text" formControlName="codePostal" />
        </label>
      </div>
      <label class="field">
        <span>Nouveau mot de passe (optionnel)</span>
        <input type="password" formControlName="motDePasse" autocomplete="new-password" />
      </label>
      <p class="hint muted">Laissez le mot de passe vide pour ne pas le modifier.</p>
      <div class="actions">
        <button type="submit" class="btn-primary" [disabled]="submitting">
          {{ submitting ? 'Enregistrement…' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  }
</div>

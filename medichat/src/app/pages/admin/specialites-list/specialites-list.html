<div class="page-wrapper">
  <div class="global-card">

    <div class="page-header">
      <div>
        <h1>Spécialités</h1>
        <p>Gérer toutes les spécialités médicales.</p>
      </div>

      <button type="button" class="primary-btn" routerLink="/admin/add-specialite">
        + Ajouter une spécialité
      </button>
    </div>

    <div class="inner-header">
      <h2>Liste des spécialités</h2>
      <p>Données synchronisées avec le serveur.</p>
    </div>

    <div class="card">
      <div class="toolbar">
        <input
          type="text"
          placeholder="Rechercher une spécialité..."
          (input)="onSearch($any($event.target).value)">
      </div>

      <div *ngIf="loading()" class="state">Chargement…</div>

      <div *ngIf="!loading() && filteredSpecialites().length === 0" class="state">
        Aucune spécialité à afficher.
      </div>

      <table *ngIf="!loading() && filteredSpecialites().length > 0">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let s of filteredSpecialites()">
            <td><strong>{{ s.nom }}</strong></td>
            <td>{{ s.description || '—' }}</td>
            <td>
              <button type="button" class="link-danger" (click)="deleteOne(s, $event)">
                Supprimer
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<!-- Modale de modification -->
<div class="modal-overlay" *ngIf="editingSpecialite()" (click)="cancelEdit()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <h2 class="modal-title">Modifier la spécialité</h2>

    <div class="form-group">
      <label for="edit-nom">Nom</label>
      <input id="edit-nom" [(ngModel)]="editForm.nom" name="edit-nom" placeholder="Nom de la spécialité" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="edit-desc">Description</label>
      <textarea id="edit-desc" [(ngModel)]="editForm.description" name="edit-desc" placeholder="Description (optionnelle)" rows="3"></textarea>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn-save" [disabled]="isSaving() || !editForm.nom.trim()" (click)="saveEdit()">
        {{ isSaving() ? 'Enregistrement…' : 'Enregistrer' }}
      </button>
      <button type="button" class="btn-cancel" (click)="cancelEdit()">Annuler</button>
    </div>
  </div>
</div>

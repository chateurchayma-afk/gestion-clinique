<div class="page-wrapper">
  <div class="global-card">

    <!-- HEADER -->
    <div class="page-header">
      <div>
        <h1>Spécialités</h1>
        <p>Gérer toutes les spécialités médicales.</p>
      </div>

      <button class="primary-btn" routerLink="/admin/add-specialite">
        + Ajouter une spécialité
      </button>
    </div>

    <!-- SOUS TITRE -->
    <div class="inner-header">
      <h2>Liste des spécialités</h2>
      <p>Consultez et gérez toutes les spécialisations médicales.</p>
    </div>

    <!-- TABLE -->
    <div class="card">

      <div class="toolbar">
        <input type="text" placeholder="Rechercher une spécialité...">
      </div>

      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Description</th>
            <th>Médecins</th>
            <th>Département</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let s of specialites()">
            <td><strong>{{ s.nom }}</strong></td>
            <td>{{ s.description }}</td>
            <td>5</td>
            <td>Médecine interne</td>

            <td>
              <span class="status active">Actif</span>
            </td>

            <td>...</td>
          </tr>
        </tbody>
      </table>

    </div>

  </div>
</div>

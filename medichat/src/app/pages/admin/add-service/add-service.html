<div class="page-container">
  <div class="global-card">

    <div class="page-header">
      <h1>Ajouter un service</h1>
      <p>Créer un nouveau service médical</p>
      <p *ngIf="errorMessage" class="form-error">{{ errorMessage }}</p>
    </div>

    <div class="inner-card">
      <div class="form-group">
        <label for="nom">Nom du service</label>
        <input
          id="nom"
          name="nom"
          [(ngModel)]="form.nom"
          placeholder="Entrez le nom du service" />
      </div>

      <div class="form-group">
        <label for="departement">Département</label>
        <input
          id="departement"
          name="departement"
          [(ngModel)]="form.departement"
          placeholder="Entrez le département" />
      </div>

      <div class="form-group">
        <label for="prix">Prix</label>
        <input
          id="prix"
          name="prix"
          [(ngModel)]="form.prix"
          placeholder="Entrez le prix" />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          [(ngModel)]="form.description"
          placeholder="Entrez la description"></textarea>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn-save" [disabled]="isSubmitting" (click)="onSubmit()">
        {{ isSubmitting ? 'Enregistrement…' : 'Enregistrer le service' }}
      </button>

      <button type="button" class="btn-cancel" (click)="goBack()">
        Annuler
      </button>
    </div>

  </div>
</div>

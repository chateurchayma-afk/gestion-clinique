<div class="global-card">

  <div class="page-header">
    <h1>Ajouter une nouvelle spécialité</h1>
    <p>Créer une nouvelle spécialité médicale</p>
  </div>

  <div class="form-group">
    <label>Nom de la spécialité</label>
    <input [(ngModel)]="form.nom" placeholder="Entrez le nom de la spécialité">
  </div>

  <div class="form-group">
    <label>Département</label>
    <input placeholder="Entrez le département">
  </div>

  <div class="form-group">
    <label>Description</label>
    <textarea [(ngModel)]="form.description" placeholder="Entrez la description"></textarea>
  </div>

  <div class="actions">
    <button class="btn-save" (click)="onSubmit()">
      Enregistrer la spécialité
    </button>

    <button class="btn-cancel" (click)="goBack()">
      Annuler
    </button>
  </div>

</div>

<div class="global-card">

  <div class="page-header">
    <h1>Ajouter une nouvelle spécialité</h1>
    <p>Créer une spécialité médicale côté serveur.</p>
    <p *ngIf="errorMessage" class="form-error">{{ errorMessage }}</p>
  </div>

  <div class="form-group">
    <label for="spec-nom">Nom de la spécialité</label>
    <input
      id="spec-nom"
      [(ngModel)]="form.nom"
      name="nom"
      placeholder="Ex. Cardiologie"
      autocomplete="off">
  </div>

  <div class="form-group">
    <label for="spec-desc">Description</label>
    <textarea
      id="spec-desc"
      [(ngModel)]="form.description"
      name="description"
      placeholder="Description courte (optionnelle)"></textarea>
  </div>

  <div class="actions">
    <button
      type="button"
      class="btn-save"
      [disabled]="isSubmitting"
      (click)="onSubmit()">
      {{ isSubmitting ? 'Enregistrement…' : 'Enregistrer la spécialité' }}
    </button>

    <button type="button" class="btn-cancel" (click)="goBack()">
      Annuler
    </button>
  </div>

</div>

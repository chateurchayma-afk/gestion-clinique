<div class="register-page">
  <div class="register-card">

    <div class="header-box">
      <h1>Créer un compte</h1>
      <p>Inscrivez-vous en tant que médecin</p>
    </div>

    <form class="register-form" (ngSubmit)="onRegister()" autocomplete="off">
      <div class="row two-cols">
        <div class="form-group">
          <label for="nom">Nom</label>
          <input
            type="text"
            id="nom"
            name="nom"
            placeholder="Entrez votre nom"
            [(ngModel)]="nom"
            required
          />
        </div>

        <div class="form-group">
          <label for="prenom">Prénom</label>
          <input
            type="text"
            id="prenom"
            name="prenom"
            placeholder="Entrez votre prénom"
            [(ngModel)]="prenom"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Entrez votre adresse e-mail"
          [(ngModel)]="email"
          required
        />
      </div>

      <div class="row two-cols">
        <div class="form-group">
          <label for="specialiteId">Spécialité</label>
          <select
            id="specialiteId"
            name="specialiteId"
            [(ngModel)]="specialiteId"
            required>
            <option value="">— Choisir une spécialité —</option>
            <option *ngFor="let s of specialitesSelect()" [value]="s.id">{{ s.nom }}</option>
          </select>
          <p *ngIf="specialitesSelect().length === 0" class="field-hint">
            Aucune spécialité disponible. Réessayez plus tard ou contactez l’administration.
          </p>
        </div>

        <div class="form-group">
          <label for="experience">Expérience</label>
          <input
            type="text"
            id="experience"
            name="experience"
            placeholder="Ex : 5 ans"
            [(ngModel)]="experience"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="telephone">Téléphone</label>
        <input
          type="text"
          id="telephone"
          name="telephone"
          placeholder="Entrez votre numéro de téléphone"
          [(ngModel)]="telephone"
        />
      </div>

      <div class="form-group">
        <label for="motDePasse">Mot de passe</label>
        <input
          type="password"
          id="motDePasse"
          name="motDePasse"
          placeholder="Entrez votre mot de passe"
          [(ngModel)]="motDePasse"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="form-group">
        <label for="adresse">Adresse</label>
        <input
          type="text"
          id="adresse"
          name="adresse"
          placeholder="Entrez votre adresse"
          [(ngModel)]="adresse"
          autocomplete="off"
        />
      </div>

      <div class="info-box">
        Votre compte sera activé après validation administrative.
      </div>

      <div class="divider-form">
        <span>ou</span>
      </div>

      <div id="google-gsi-button-host" class="google-gsi-host" aria-label="S'inscrire avec Google"></div>

      <button type="submit" class="submit-btn">Créer mon compte</button>

      <p class="bottom-text" *ngIf="message" style="color: green;">
        {{ message }}
      </p>

      <p class="bottom-text" *ngIf="errorMessage" style="color: red;">
        {{ errorMessage }}
      </p>

      <p class="bottom-text">
        Déjà un compte ?
        <a [routerLink]="['/login']" [queryParams]="{ form: '1' }">Se connecter</a>
      </p>

      <p class="bottom-text">
        ← <a [routerLink]="['/login']" [queryParams]="{ form: '1' }">Retour à la connexion</a>
      </p>
    </form>
  </div>
</div>

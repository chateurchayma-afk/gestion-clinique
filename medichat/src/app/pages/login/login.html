<div class="page">
  <div class="card">
    <h1 class="app-title">MediChat</h1>

    <ng-container *ngIf="!showForm(); else loginForm">
      <h3 class="welcome">Bienvenue</h3>
      <p class="desc">
        Connectez-vous pour accéder<br />
        à votre application
      </p>

      <button type="button" id="login-welcome-btn" class="btn-main" (click)="showLoginForm()">
        Connexion
      </button>

      <div class="divider">
        <span>ou</span>
      </div>

      <div id="google-gsi-button-host" class="google-gsi-host" aria-label="Connexion avec Google"></div>

      <div class="divider">
        <span>ou</span>
      </div>

      <h4 class="new-user">Nouvel utilisateur ?</h4>
      <a class="link" [routerLink]="['/register']">Créer mon compte</a>

      <div class="line"></div>

      @if (canInstall()) {
        <button type="button" class="install-btn" (click)="installApp()">
          📲 Installer l’application MediChat
        </button>
      }
    </ng-container>

    <ng-template #loginForm>
      <h3 class="welcome">Connexion</h3>
      <p class="desc">
        Entrez votre email et votre mot de passe pour vous connecter.
      </p>
      <p *ngIf="guardHint" class="guard-hint">{{ guardHint }}</p>

      <form class="login-form" (ngSubmit)="onLogin()" novalidate>
        <input
          id="login-email"
          class="input-field"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Email"
          autocomplete="username"
          required
        />
        <input
          id="login-password"
          class="input-field"
          type="password"
          [(ngModel)]="motDePasse"
          name="motDePasse"
          placeholder="Mot de passe"
          autocomplete="current-password"
          required
        />
        <div *ngIf="pendingMessage" class="pending-msg">
          <span class="pending-icon">⏳</span>
          <span>{{ pendingMessage }}</span>
        </div>
        <div *ngIf="errorMessage" class="error-msg">
          {{ errorMessage }}
        </div>
        <button type="submit" class="btn-main">
          Se connecter
        </button>
      </form>

      <a class="forgot-link" [routerLink]="['/forgot-password']">
        Mot de passe oublié ?
      </a>

      <button type="button" class="login-back" (click)="showForm.set(false)">
        ← Retour
      </button>
    </ng-template>
  </div>
</div>

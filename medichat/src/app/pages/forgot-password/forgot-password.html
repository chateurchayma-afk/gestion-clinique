<div class="forgot-page">
  <div class="forgot-card">

    <h1>Mot de passe oublié</h1>
    <p class="subtitle">
      Entrez votre adresse e-mail et définissez un nouveau mot de passe pour
      récupérer l'accès à votre compte.
    </p>

    <form (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Entrez votre adresse e-mail"
          [(ngModel)]="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="newPassword">Nouveau mot de passe</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            placeholder="Entrez votre nouveau mot de passe"
            [(ngModel)]="newPassword"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirmez votre mot de passe"
            [(ngModel)]="confirmPassword"
            required
          />
        </div>
      </div>

      <div *ngIf="errorMessage" class="msg msg--error">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="msg msg--success">{{ successMessage }}</div>

      <button type="submit" class="submit-btn" [disabled]="loading">
        {{ loading ? 'Mise à jour…' : 'Réinitialiser le mot de passe' }}
      </button>

      <a routerLink="/login" [queryParams]="{ form: '1' }" class="back-link">← Retour à la connexion</a>
    </form>
  </div>
</div>

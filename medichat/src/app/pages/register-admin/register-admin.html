<div class="register-page">
  <div class="register-card">

    <div class="header-box">
      <h1>Compte administrateur</h1>
      <p>Réservé à la configuration de la plateforme (PFE / démo).</p>
    </div>

    <form class="register-form" (ngSubmit)="onRegister()">
      <div class="row two-cols">
        <div class="form-group">
          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom" [(ngModel)]="nom" required />
        </div>
        <div class="form-group">
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" name="prenom" [(ngModel)]="prenom" required />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required />
      </div>

      <div class="form-group">
        <label for="telephone">Téléphone (optionnel)</label>
        <input type="text" id="telephone" name="telephone" [(ngModel)]="telephone" />
      </div>

      <div class="row two-cols">
        <div class="form-group">
          <label for="motDePasse">Mot de passe</label>
          <input type="password" id="motDePasse" name="motDePasse" [(ngModel)]="motDePasse" required />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmer</label>
          <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required />
        </div>
      </div>

      <p class="info-note">
        Compte de démo fourni en base : <strong>admin&#64;medichat.local</strong> / <strong>admin123</strong>
      </p>
      <div class="divider-form">
        <span>ou</span>
      </div>

      <div id="google-gsi-button-host" class="google-gsi-host" aria-label="S'inscrire avec Google"></div>

      <button type="submit" class="submit-btn">Créer l’administrateur</button>

      <p class="bottom-text" *ngIf="message" style="color: green;">{{ message }}</p>
      <p class="bottom-text" *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</p>
      <p class="bottom-text"><a [routerLink]="['/login']" [queryParams]="{ form: '1' }">Retour connexion</a></p>
    </form>
  </div>
</div>
